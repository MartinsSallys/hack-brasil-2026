name: "JAS Easy Path"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Validar index.html"
        run: |
          test -f index.html || { echo "index.html não encontrado na raiz"; exit 1; }
          grep -q "<title>" index.html || { echo "Falta a tag <title>"; exit 1; }
          echo "HTML ok"